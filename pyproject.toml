[project]
name = "toy-pickplace"
version = "0.1.0"
description = "MuJoCo tabletop pick-and-place scene with Franka Panda"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mink>=1.2.0",
  "mujoco>=3.1.3",
  "torch",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"

[dependency-groups]
dev = [
    "ipython>=8.39.0",
]
