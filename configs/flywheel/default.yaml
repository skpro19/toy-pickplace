# run 
run_name: null

# flywheel loop 
dagger_rounds: 10

# expert data collection
num_expert_episodes: 100
max_steps: 8000
expert_seed: 0

# training
epochs: 1000
batch_size: 200
early_stop_patience: 50
dataloader_workers: 2

# dataset mixing (retrain rounds only; round 0 uses expert data only)
expert_ratio: 0.5  # [expert vs dagger] data ratio
dagger_intervention_ratio: 0.8  # [expert-executed vs policy-executed] ratio in DAgger sampling

# dagger rollout 
intervention_threshold: 0.1  # L2 arm threshold; gripper disagreement also triggers
intervention_steps: 50         # min expert-control burst after trigger
dagger_episodes: 50
rollout_max_steps: 1400

#  evaluation / checkpoint selection 
eval_interval: 20
eval_episodes: 25
eval_max_steps: 1400
mode: mode-b  # mode-a = score first; mode-b = placement rate first
eval_seed: 42

# parallelism 
workers: 6 # eval + rollout workers

# seeds
train_seed: 0  # model init + training batch sampling
dagger_seed: 0  # dagger rollout seed
