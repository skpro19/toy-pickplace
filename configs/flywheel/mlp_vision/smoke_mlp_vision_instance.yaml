# run
run_name: null
arch: vision_mlp

# flywheel loop
dagger_rounds: 2

# expert data collection
num_expert_episodes: 50
max_steps: 80
train_capture_hz: 60

# training
epochs: 50
batch_size: 16
early_stop_patience: 10
dataloader_workers: 0
persistent_workers: false

# dataset mixing
expert_ratio: 0.5
dagger_intervention_ratio: 0.8

# DAgger rollout
intervention_threshold: 0.0
intervention_steps: 5
dagger_episodes: 30
rollout_max_steps: 80

# in-loop checkpoint evaluation
eval_interval: 1
eval_episodes: 1
eval_max_steps: 80
eval_capture_hz: 60
mode: mode-b

# large held-out evaluation after the flywheel completes
final_eval_episodes: 5
final_eval_seed: 20260716
final_eval_workers: 1
final_eval_capture_hz: 60

# parallelism
workers: 1

# seeds
global_seed: 0
