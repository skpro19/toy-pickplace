# run
run_name: null
arch: vision_mlp

# flywheel loop
dagger_rounds: 1

# expert data collection
num_expert_episodes: 100
max_steps: 8000
train_capture_hz: 60

# training
epochs: 1000
batch_size: 768
early_stop_patience: 50
dataloader_workers: 4
persistent_workers: true

# dataset mixing (retrain rounds only; round 0 uses expert data only)
expert_ratio: 0.5
dagger_intervention_ratio: 0.8

# dagger rollout
intervention_threshold: 0.1
intervention_steps: 50
dagger_episodes: 50
rollout_max_steps: 1400

# evaluation / checkpoint selection
eval_interval: 20
eval_episodes: 25
eval_max_steps: 1400
eval_capture_hz: 60
mode: mode-b

# large held-out evaluation after the flywheel completes
final_eval_episodes: 100
final_eval_seed: 20260716
final_eval_workers: 12
final_eval_capture_hz: 60

# parallelism
workers: 12

# seeds
global_seed: 0
