# same as BASEv3.yaml with following changes -> 
# dropout: 0

# run 
run_name: null
arch: vision_mlp  # mlp | vision_mlp

# flywheel loop 
dagger_rounds: 10

# expert data collection
num_expert_episodes: 100
max_steps: 8000
train_capture_hz: 60  # obs/action/image rate for expert data and DAgger rollouts

# training
epochs: 1000
batch_size: 768
dropout: 0.1  # backbone dropout probability for the policy model
early_stop_patience: 50
dataloader_workers: 4
persistent_workers: true

# dataset mixing (retrain rounds only; round 0 uses expert data only)
expert_ratio: 0.5  # [expert vs dagger] data ratio
dagger_intervention_ratio: 0.8  # [expert-executed vs policy-executed] ratio in DAgger sampling
dagger_recency_decay: 1.0  # 1.0 = equal DAgger-round weights; lower values favor recent rounds

# dagger rollout 
intervention_threshold: 0.1  # L2 arm threshold; gripper disagreement also triggers
intervention_steps: 50         # min expert-control burst after trigger
dagger_episodes: 50
rollout_max_steps: 1400

#  evaluation / checkpoint selection 
eval_interval: 20
eval_episodes: 50
eval_max_steps: 1400
eval_capture_hz: 60  # policy inference rate during in-loop checkpoint evaluation
mode: mode-b  # mode-a = score first; mode-b = placement rate first

# large held-out evaluation after the flywheel completes
final_eval_episodes: 100
final_eval_seed: 20260716
final_eval_workers: 12
final_eval_capture_hz: 60

# parallelism 
workers: 12 # eval + rollout workers

# seeds
global_seed: 0  # derives expert collection, training, DAgger, and in-loop evaluation seeds

# warm-start
warm_start: true  # true = initialize each DAgger round from the previous round's best.pt
fresh_optimizer_state: false  # reset Adam state per round (recommended when warm_start is true)
